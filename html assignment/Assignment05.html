<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3> Unordered List</h3>
    <ul type="square">
        <li>C++</li>
        <li>Web D</li>
        <li>Math</li>
    </ul>
    <ul type="circle">
        <li>C++</li>
        <li>Web D</li>
        <li>Math</li>
    </ul>
    <ul>
        <li>C++</li>
        <li>Web D</li>
        <li>Math</li>
    </ul>
    <h3> Orderd List</h3>
    <ol>
        <li>C++</li>
        <li>web D</li>
        <li>Math</li>
    </ol>
    <ol type="A">
        <li>C++</li>
        <li>web D</li>
        <li>Math</li>
    </ol>
    <ol type="i">
        <li>C++</li>
        <li>Web D</li>
        <li>Math</li>
    </ol>
    <h3> Description List</h3>
    <dl> 
        <dt> HTML</dt>
        <dt> Hyper Text Markup Language</dt>
        <dt> CSS</dt>
        <dt> Cascading Style Sheets</dt>
    </dl>
</body>
</html>
